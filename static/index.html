<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xingji · 旅行规划助手</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --bg: #f5f5f5;
    --surface: #fff;
    --sidebar: #1a1a2e;
    --sidebar-text: #ccc;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --user-bubble: #4f46e5;
    --agent-bubble: #fff;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --danger: #ef4444;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; background: var(--bg); height:100vh; display:flex; }
  a { color: var(--primary); }

  /* Sidebar */
  .sidebar {
    width: 260px; background: var(--sidebar); color: var(--sidebar-text);
    display:flex; flex-direction:column; padding:20px; gap:20px; flex-shrink:0;
  }
  .sidebar h1 { color:#fff; font-size:1.25rem; font-weight:700; letter-spacing:-0.02em; }
  .sidebar h1 span { color: var(--primary); }
  .sidebar .field { display:flex; flex-direction:column; gap:6px; }
  .sidebar label { font-size:.75rem; text-transform:uppercase; letter-spacing:0.05em; color:#888; }
  .sidebar input {
    padding:8px 12px; border-radius:8px; border:1px solid #333;
    background:#16213e; color:#eee; font-size:.875rem; outline:none;
    transition: border-color .15s;
  }
  .sidebar input:focus { border-color: var(--primary); }
  .sidebar button {
    padding:10px; border-radius:8px; border:none; cursor:pointer;
    font-size:.875rem; font-weight:600; transition: background .15s;
  }
  .btn-new { background: var(--primary); color:#fff; }
  .btn-new:hover { background: var(--primary-hover); }
  .btn-delete { background: transparent; color:#999; border:1px solid #444 !important; }
  .btn-delete:hover { color:#fff; border-color:#666 !important; }

  /* Main */
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .header {
    padding:16px 24px; background:var(--surface); border-bottom:1px solid var(--border);
    font-weight:600; font-size:.95rem; display:flex; align-items:center; gap:8px;
  }
  .header .dot { width:8px; height:8px; border-radius:50%; background:#22c55e; }
  .chat { flex:1; overflow-y:auto; padding:24px; display:flex; flex-direction:column; gap:16px; }
  .chat-empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-secondary); font-size:.95rem; text-align:center; line-height:1.8; }

  /* Bubbles */
  .msg { display:flex; gap:10px; max-width:85%; animation: fadeIn .2s ease; }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg.agent { align-self:flex-start; }
  .avatar {
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-size:.85rem; flex-shrink:0;
  }
  .msg.user .avatar { background:var(--primary); color:#fff; }
  .msg.agent .avatar { background:#e0e7ff; color:var(--primary); }
  .bubble {
    padding:12px 16px; border-radius:var(--radius); font-size:.9rem;
    line-height:1.65; box-shadow:var(--shadow);
  }
  .msg.user .bubble { background:var(--user-bubble); color:#fff; border-bottom-right-radius:4px; }
  .msg.agent .bubble { background:var(--agent-bubble); color:var(--text); border:1px solid var(--border); border-bottom-left-radius:4px; }

  /* Plan card inside agent bubble */
  .plan-card {
    margin-top:12px; padding:16px; background:#f8fafc; border-radius:10px;
    border:1px solid var(--border); font-size:.85rem;
  }
  .plan-card h3 { margin-bottom:8px; font-size:.95rem; }
  .plan-card .meta { display:flex; flex-wrap:wrap; gap:8px 16px; margin-bottom:12px; color:var(--text-secondary); font-size:.8rem; }
  .plan-card .meta span { background:#e0e7ff; padding:2px 8px; border-radius:4px; color:var(--primary); }
  .plan-card .day { margin-top:12px; padding:10px 0; border-top:1px solid var(--border); }
  .plan-card .day:first-of-type { border-top:none; }
  .plan-card .day h4 { font-size:.85rem; margin-bottom:4px; }
  .plan-card .day p { margin:3px 0; color:var(--text-secondary); }
  .plan-card .total { margin-top:12px; padding-top:10px; border-top:2px solid var(--primary); font-weight:600; color:var(--primary); }

  /* Bubble markdown content */
  .bubble h2 { font-size:1.1rem; margin:12px 0 6px; }
  .bubble h3 { font-size:1rem; margin:10px 0 4px; }
  .bubble ul { padding-left:18px; margin:4px 0; }
  .bubble li { margin:2px 0; }
  .bubble strong { color: var(--primary); }
  .msg.user .bubble strong { color: #c7d2fe; }
  .msg.user .bubble h3, .msg.user .bubble h2 { color: #fff; }

  /* Input */
  .input-area {
    padding:16px 24px; background:var(--surface); border-top:1px solid var(--border); display:flex; gap:10px;
  }
  .input-area textarea {
    flex:1; padding:10px 14px; border-radius:10px; border:1px solid var(--border);
    font-size:.9rem; font-family:inherit; resize:none; outline:none; rows:1;
    max-height:120px; transition: border-color .15s;
  }
  .input-area textarea:focus { border-color: var(--primary); }
  .input-area button {
    padding:10px 20px; border-radius:10px; border:none; background:var(--primary);
    color:#fff; font-weight:600; cursor:pointer; font-size:.875rem;
    transition: background .15s; white-space:nowrap;
  }
  .input-area button:hover { background: var(--primary-hover); }
  .input-area button:disabled { opacity:.5; cursor:not-allowed; }

  /* Typing indicator */
  .typing { display:flex; gap:4px; padding:16px; }
  .typing span { width:7px; height:7px; border-radius:50%; background:#ccc; animation: bounce 1.4s infinite ease-in-out both; }
  .typing span:nth-child(1) { animation-delay:-0.32s; }
  .typing span:nth-child(2) { animation-delay:-0.16s; }

  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  @keyframes bounce { 0%,80%,100% { transform:scale(0); } 40% { transform:scale(1); } }

  /* Responsive */
  @media (max-width:700px) {
    .sidebar { display:none; }
    .msg { max-width:95%; }
  }
</style>
</head>
<body>

<aside class="sidebar">
  <h1>✦ <span>Xingji</span></h1>
  <div class="field">
    <label>用户 ID</label>
    <input type="text" id="userId" value="local-user" maxlength="64">
  </div>
  <div class="field">
    <label>会话 ID</label>
    <input type="text" id="sessionId" maxlength="64" placeholder="自动生成...">
  </div>
  <button class="btn-new" onclick="newSession()">＋ 新会话</button>
  <button class="btn-delete" onclick="clearChat()">清空对话</button>
  <div style="margin-top:auto;font-size:.75rem;color:#555;">
    基于 LangGraph 构建<br>FastAPI + SQLite checkpoint
  </div>
</aside>

<div class="main">
  <div class="header"><span class="dot"></span> 旅行规划对话</div>
  <div class="chat" id="chat">
    <div class="chat-empty">
      <div>👋 你好！我是你的旅行规划助手。<br>试试说：<strong>"帮我规划一个3天的京都旅行，适中预算，喜欢寺庙和日式庭院"</strong></div>
    </div>
  </div>
  <div class="input-area">
    <textarea id="msgInput" rows="1" placeholder="输入旅行需求..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
const API = '/api/v1/chat';
let currentPlan = null;

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function newSession() {
  document.getElementById('sessionId').value = uid();
  document.getElementById('chat').innerHTML = '<div class="chat-empty"><div>✨ 新会话已创建<br>输入旅行需求开始规划</div></div>';
  currentPlan = null;
}

function clearChat() {
  document.getElementById('chat').innerHTML = '<div class="chat-empty"><div>👋 对话已清空<br>输入旅行需求重新开始</div></div>';
  currentPlan = null;
}

// Auto-generate session ID
if (!document.getElementById('sessionId').value) {
  newSession();
}

function addMessage(role, text, plan) {
  const chat = document.getElementById('chat');
  // Remove empty state
  const empty = chat.querySelector('.chat-empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '我' : '✦';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'agent') {
    // Render markdown
    if (typeof marked !== 'undefined') {
      marked.setOptions({ breaks: true, gfm: true });
      bubble.innerHTML = marked.parse(text);
    } else {
      bubble.textContent = text;
    }

    // Append plan card
    if (plan && plan.days && plan.days.length > 0) {
      currentPlan = plan;
      const card = document.createElement('div');
      card.className = 'plan-card';
      card.innerHTML = buildPlanCard(plan);
      bubble.appendChild(card);
    }
  } else {
    bubble.textContent = text;
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function buildPlanCard(plan) {
  const budgetLabel = { budget:'经济', moderate:'适中', luxury:'奢华' };
  let html = '<h3>🗺️ ' + escapeHtml(plan.destination) + ' 旅行方案</h3>';
  html += '<div class="meta">';
  if (plan.start_date) html += '<span>📅 ' + plan.start_date + ' → ' + plan.end_date + '</span>';
  if (plan.budget) html += '<span>💰 ' + (budgetLabel[plan.budget] || plan.budget) + '</span>';
  if (plan.travelers) html += '<span>👥 ' + plan.travelers + '人</span>';
  html += '</div>';
  if (plan.summary) html += '<p>' + escapeHtml(plan.summary) + '</p>';

  (plan.days || []).forEach(d => {
    html += '<div class="day"><h4>第' + d.day + '天' + (d.day_date ? ' · ' + d.day_date : '') + '</h4>';
    if (d.morning) html += '<p>☀️ 上午: ' + escapeHtml(d.morning) + '</p>';
    if (d.afternoon) html += '<p>🌤️ 下午: ' + escapeHtml(d.afternoon) + '</p>';
    if (d.evening) html += '<p>🌙 晚间: ' + escapeHtml(d.evening) + '</p>';
    if (d.meals && d.meals.length) html += '<p>🍽️ ' + escapeHtml(d.meals.join(' / ')) + '</p>';
    if (d.estimated_cost) html += '<p>💲 ' + escapeHtml(d.estimated_cost) + '</p>';
    if (d.notes) html += '<p>📝 ' + escapeHtml(d.notes) + '</p>';
    html += '</div>';
  });

  if (plan.total_estimated_cost) {
    html += '<div class="total">总预估: ' + escapeHtml(plan.total_estimated_cost) + '</div>';
  }
  return html;
}

function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function addTyping() {
  const chat = document.getElementById('chat');
  const empty = chat.querySelector('.chat-empty');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'msg agent';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="avatar">✦</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

async function send() {
  const input = document.getElementById('msgInput');
  const btn = document.getElementById('sendBtn');
  const msg = input.value.trim();
  if (!msg) return;

  const userId = document.getElementById('userId').value.trim() || 'anonymous';
  let sessionId = document.getElementById('sessionId').value.trim();
  if (!sessionId) { sessionId = uid(); document.getElementById('sessionId').value = sessionId; }

  // Show user message
  addMessage('user', msg);
  input.value = '';
  btn.disabled = true;
  addTyping();

  try {
    const resp = await fetch(API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ user_id: userId, session_id: sessionId, message: msg }),
    });
    const json = await resp.json();
    removeTyping();

    if (resp.ok && json.code === 0) {
      const data = json.data;
      addMessage('agent', data.response, data.plan);
    } else {
      const errMsg = json.message || ('HTTP ' + resp.status);
      addMessage('agent', '❌ 出错了: ' + errMsg);
    }
  } catch (err) {
    removeTyping();
    addMessage('agent', '❌ 网络错误: ' + err.message);
  } finally {
    btn.disabled = false;
    input.focus();
  }
}

// Focus input on load
document.getElementById('msgInput').focus();

// Auto-resize textarea
document.getElementById('msgInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});
</script>
</body>
</html>
